<section class="section price-list" id="prices">
    <div class="container">
        <div class="section-header" appScrollReveal>
            <h2 class="section-title">Прайс-лист</h2>
            <p class="section-subtitle">
                Ознакомьтесь с полным списком наших услуг и цен
            </p>
        </div>

        <div class="qr-container" appScrollReveal>
            <div class="qr-card">

                <div class="qr-frame">
                    <div class="qr-code-wrapper">
                        <!-- Angularx-qrcode usage -->
                        <qrcode [qrdata]="sheetUrl" [width]="260" [margin]="1" [errorCorrectionLevel]="'M'"
                            [colorDark]="'#2c3e50'"></qrcode>
                    </div>
                </div>

                <h3 class="qr-hint-title">Сканируйте QR-код</h3>
                <p class="qr-hint-text">
                    Наведите камеру вашего телефона, чтобы открыть<br>актуальный прайс-лист.
                </p>

                <a [href]="sheetUrl" target="_blank" class="btn btn-premium">
                    <span>Открыть Прайс-лист</span>
                    <!-- Simple arrow icon -->
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 17L17 7M17 7H7M17 7V17" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </a>
            </div>
        </div>
    </div>
</section>
