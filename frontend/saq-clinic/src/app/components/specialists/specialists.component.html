<section class="specialists-section">
    <div class="container">
        <div class="section-header">
            <span class="section-badge">Команда экспертов</span>
            <h2 class="section-title">Наши Специалисты</h2>
            <p class="section-subtitle">
                В нашем центре работают именитые специалисты-практики с международным опытом
            </p>
        </div>

        <div class="specialists-grid">
            <div class="specialist-card" *ngFor="let specialist of specialists; let i = index">
                <div class="card-image">
                    <img [src]="specialist.image" [alt]="specialist.name">
                    <a class="reviews-badge" *ngIf="specialist.reviewsCount"
                        href="https://2gis.kz/astana/firm/70000001103819632/tab/reviews" target="_blank" rel="noopener">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                        </svg>
                        {{ specialist.reviewsCount }} отзывов
                    </a>
                </div>

                <div class="card-content">
                    <h3 class="specialist-name">{{ specialist.name }}</h3>
                    <p class="specialist-role">{{ specialist.role }}</p>

                    <div class="helps-with">
                        <span class="helps-title">Поможет вам:</span>
                        <ul>
                            <li *ngFor="let item of specialist.helpsWith">{{ item }}</li>
                        </ul>
                    </div>

                    <a class="btn btn-specialist" href="https://wa.me/77003666201" target="_blank" rel="noopener">
                        Записаться к специалисту
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

<app-footer></app-footer>
